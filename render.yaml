services:
  - type: web
    runtime: go
    name: ascend-collective-api
    region: singapore
    plan: free
    buildCommand: cd backend && go build -o bin/api ./cmd/server
    preDeployCommand: cd backend && go run ./cmd/migrate
    startCommand: cd backend && ./bin/api
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ascend-collective-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://ravikrpandey.github.io
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: INQUIRY_EMAIL_FROM
        sync: false
      - key: INQUIRY_NOTIFICATION_TO
        sync: false

databases:
  - name: ascend-collective-db
    databaseName: ascend
    user: ascend
    plan: free
